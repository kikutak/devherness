name: Build and publish agent-runner image

# devherness自身のCI(GitHub側)。GitLab版のルート.gitlab-ci.ymlの
# build-agent-runner-image jobに相当。GitHub Container Registry(ghcr.io)へ
# agent-runnerイメージを発行する。

on:
  push:
    branches: [main]
    paths:
      - docker/agent-runner/**
      - ci/**
      - prompts/**
      - mcp/**
      - .github/workflows/build-image.yml
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/agent-runner

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent-runner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
