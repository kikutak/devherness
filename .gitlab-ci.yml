# devherness自身のCI: agent-runnerイメージのビルド/公開と、
# コンポーネント定義(templates/multi-agent-loop/template.yml)の構文検証を行う。
# このリポジトリはコンポーネント/テンプレートリポジトリであり、
# 他プロジェクトはここで公開したイメージ・コンポーネントを `include:` で利用する
# (詳細はREADME.md参照)。

stages:
  - validate
  - build

lint-component:
  stage: validate
  image: alpine:3.20
  tags:
    - docker
  script:
    - apk add --no-cache yq curl
    - echo "templates/multi-agent-loop/template.yml の構文チェック"
    - yq eval templates/multi-agent-loop/template.yml > /dev/null
    - >
      curl -sS -f -X POST
      -H "Content-Type: application/json"
      -H "PRIVATE-TOKEN: ${CI_JOB_TOKEN}"
      --data-urlencode "content@templates/multi-agent-loop/template.yml"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/ci/lint"
      || echo "CI Lint API呼び出しに失敗しました(権限/バージョン依存の可能性、要確認)"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build-agent-runner-image:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      # registry.lab.internalの証明書がRunnerホスト/dind双方から信頼されないため、
      # dindサービス自体にもinsecure-registryを明示的に渡す
      # (ホストの/etc/docker/daemon.jsonの設定はdind内部のデーモンには継承されない)。
      command: ["--insecure-registry=registry.lab.internal"]
  tags:
    - docker
  variables:
    IMAGE: "${CI_REGISTRY_IMAGE}/agent-runner"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "${IMAGE}:${CI_COMMIT_SHORT_SHA}" -f docker/agent-runner/Dockerfile .
    - docker push "${IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "${IMAGE}:${CI_COMMIT_SHORT_SHA}" "${IMAGE}:${CI_COMMIT_TAG}"
        docker tag "${IMAGE}:${CI_COMMIT_SHORT_SHA}" "${IMAGE}:latest"
        docker push "${IMAGE}:${CI_COMMIT_TAG}"
        docker push "${IMAGE}:latest"
      fi
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
